server {
  listen 80;
  root /usr/share/nginx/html;

  # "api" resolves through Docker Compose DNS (service discovery)
  location /api/     { proxy_pass http://api:5000; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; client_max_body_size 30m; }
  location /uploads/ { proxy_pass http://api:5000; }

  # SPA fallback: React Router handles every other path
  location /         { try_files $uri /index.html; }
}
